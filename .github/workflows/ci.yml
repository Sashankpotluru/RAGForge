name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/test/*.test.mjs
      - run: node web/build.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.9
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync pytest
      - run: uv run --no-sync ragforge evaluate --output /tmp/fixture.json
      - run: docker compose up --build -d
      - run: RUN_QDRANT_INTEGRATION=1 RUN_COMPOSE_SMOKE=1 uv run --no-sync pytest tests/integration
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
